{% extends "base.html" %}

{% block title %}Register - FinMinimal{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-6">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-emerald-500 items-center justify-center shadow-xl shadow-blue-500/25 mb-3">
            <i class="fa-solid fa-wallet text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Create Account</h1>
        <p class="text-sm text-slate-400 mt-1">Start tracking your personal finances with privacy</p>
    </div>

    <!-- Register Card -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-800">
        
        {% if error %}
        <div class="mb-5 p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-3.5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Full Name *</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><i class="fa-regular fa-user"></i></span>
                    <input type="text" name="full_name" value="{{ full_name or '' }}" required placeholder="e.g. Rahul Sharma" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 placeholder-slate-600">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Email Address *</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" name="email" value="{{ email or '' }}" required placeholder="you@example.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 placeholder-slate-600">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Password *</label>
                    <input type="password" name="password" required placeholder="Min. 8 chars" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 placeholder-slate-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Confirm *</label>
                    <input type="password" name="confirm_password" required placeholder="Re-type password" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 placeholder-slate-600">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Primary Currency</label>
                <select name="currency_symbol" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
                    <option value="₹">₹ - Indian Rupee (INR)</option>
                    <option value="$">$ - US Dollar (USD)</option>
                    <option value="€">€ - Euro (EUR)</option>
                    <option value="£">£ - British Pound (GBP)</option>
                    <option value="AED">AED - UAE Dirham</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all touch-press cursor-pointer flex items-center justify-center gap-2 mt-4">
                <span>Create Free Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-5 pt-4 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-400">
                Already registered? 
                <a href="/login" class="text-blue-400 font-semibold hover:underline">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
