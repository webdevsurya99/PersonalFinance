{% extends "base.html" %}

{% block title %}Register - FinMinimal{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md my-auto py-8">
    <!-- Brand Header -->
    <div class="text-center mb-6">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-[#0F172A] items-center justify-center shadow-lg shadow-slate-900/15 mb-3">
            <i class="fa-solid fa-wallet text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Create Account</h1>
        <p class="text-sm text-slate-500 font-medium mt-1">Start tracking your personal finances with privacy</p>
    </div>

    <!-- Register Card -->
    <div class="fin-card rounded-3xl p-6 sm:p-8 shadow-sm">
        
        {% if error %}
        <div class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2 font-medium">
            <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-3.5">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Full Name *</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-regular fa-user"></i></span>
                    <input type="text" name="full_name" value="{{ full_name or '' }}" required placeholder="e.g. Rahul Sharma" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Email Address *</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" name="email" value="{{ email or '' }}" required placeholder="you@example.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Password *</label>
                    <input type="password" name="password" required placeholder="Min. 8 chars" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Confirm *</label>
                    <input type="password" name="confirm_password" required placeholder="Re-type password" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Primary Currency</label>
                <select name="currency_symbol" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-semibold focus:outline-none focus:border-slate-900 focus:bg-white transition-colors">
                    <option value="₹">₹ - Indian Rupee (INR)</option>
                    <option value="$">$ - US Dollar (USD)</option>
                    <option value="€">€ - Euro (EUR)</option>
                    <option value="£">£ - British Pound (GBP)</option>
                    <option value="AED">AED - UAE Dirham</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-[#0F172A] hover:bg-slate-800 text-white font-bold rounded-2xl shadow-md shadow-slate-900/15 transition-all touch-press cursor-pointer flex items-center justify-center gap-2 mt-4 active:scale-98">
                <span>Create Free Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-5 pt-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500 font-medium">
                Already registered? 
                <a href="/login" class="text-slate-900 font-bold hover:underline">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
