{% extends "base.html" %}

{% block title %}Edit Credit Card - FinMinimal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-black tracking-tight text-slate-900">Edit Credit Card</h2>
            <p class="text-xs sm:text-sm text-slate-500">Update limits, billing cycles, or network details</p>
        </div>
        <a href="/accounts" class="text-xs font-semibold text-slate-500 hover:text-slate-900 flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back</span>
        </a>
    </div>

    <div class="fin-card rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
        <form action="/accounts/card/{{ card.id }}/edit" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="card_image_url" value="{{ card.card_image_url or '' }}">
            <input type="hidden" name="card_color_gradient" value="{{ card.card_color_gradient }}">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Bank Name *</label>
                    <input type="text" name="bank_name" value="{{ card.bank_name }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Card Name *</label>
                    <input type="text" name="card_name" value="{{ card.card_name }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Card Network *</label>
                    <select name="card_network" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                        <option value="Visa" {% if card.card_network == 'Visa' %}selected{% endif %}>Visa</option>
                        <option value="Mastercard" {% if card.card_network == 'Mastercard' %}selected{% endif %}>Mastercard</option>
                        <option value="RuPay" {% if card.card_network == 'RuPay' %}selected{% endif %}>RuPay</option>
                        <option value="Amex" {% if card.card_network == 'Amex' %}selected{% endif %}>American Express</option>
                        <option value="Diners Club" {% if card.card_network == 'Diners Club' %}selected{% endif %}>Diners Club</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Last 4 Digits *</label>
                    <input type="text" maxlength="4" pattern="\d{4}" name="last_4_digits" value="{{ card.last_4_digits }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs font-mono">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Total Credit Limit ({{ user.currency_symbol }}) *</label>
                    <input type="number" step="0.01" min="1" name="total_limit" value="{{ card.total_limit }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-extrabold text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Available Credit Limit ({{ user.currency_symbol }}) *</label>
                    <input type="number" step="0.01" min="0" name="available_limit" value="{{ card.available_limit }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-extrabold text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Statement / Billing Day of Month *</label>
                    <input type="number" min="1" max="31" name="billing_day" value="{{ card.billing_day }}" required class="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Payment Due Day of Month *</label>
                    <input type="number" min="1" max="31" name="due_day" value="{{ card.due_day }}" required class="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 shadow-xs">
                </div>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="/accounts" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm cursor-pointer transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
