{% extends "base.html" %}

{% block title %}Add Bank Account - FinMinimal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-white">Add Bank Account</h2>
            <p class="text-xs sm:text-sm text-slate-400">Select a major Indian bank preset or create a custom account</p>
        </div>
        <a href="/accounts" class="text-xs text-slate-400 hover:text-white flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back</span>
        </a>
    </div>

    <!-- Bank Presets Selector -->
    <div class="glass-card rounded-2xl p-5 border border-slate-800">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Popular Major Indian Banks</label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            {% for b in bank_presets %}
            <button type="button" onclick="selectBankPreset('{{ b.name }}', '{{ b.color }}')" class="p-2.5 rounded-xl border border-slate-800 hover:border-blue-500/50 bg-slate-900/60 hover:bg-slate-800/80 text-left transition-all flex items-center gap-2 group cursor-pointer">
                <div class="w-3 h-3 rounded-full shrink-0" style="background-color: {{ b.color }};"></div>
                <span class="text-xs font-medium text-slate-300 group-hover:text-white truncate">{{ b.short_name }}</span>
            </button>
            {% endfor %}
        </div>
    </div>

    <!-- Form -->
    <div class="glass-card rounded-2xl p-6 border border-slate-800">
        <form action="/accounts/bank/new" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Bank Name *</label>
                    <input type="text" id="bank_name_input" name="bank_name" required placeholder="e.g. HDFC Bank" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Account Nickname *</label>
                    <input type="text" name="account_name" required placeholder="e.g. Salary Account / Savings" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Account Last 4 Digits *</label>
                    <input type="text" maxlength="4" pattern="\d{4}" name="account_number_last4" required placeholder="e.g. 5678" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">IFSC Code (Optional)</label>
                    <input type="text" name="ifsc_code" placeholder="e.g. HDFC0001234" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 uppercase">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Initial / Opening Balance ({{ user.currency_symbol }}) *</label>
                    <input type="number" step="0.01" min="0" name="initial_balance" value="0.00" required class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Brand Color Accent</label>
                    <input type="color" id="bank_color_input" name="color" value="#004c8f" class="w-full h-11 bg-slate-900 border border-slate-700 rounded-xl p-1 cursor-pointer">
                </div>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="/accounts" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-lg shadow-blue-600/30 cursor-pointer">
                    Create Bank Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function selectBankPreset(name, color) {
        document.getElementById('bank_name_input').value = name;
        document.getElementById('bank_color_input').value = color;
    }
</script>
{% endblock %}
