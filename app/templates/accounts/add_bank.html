{% extends "base.html" %}

{% block title %}Add Bank Account - FinMinimal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-black tracking-tight text-slate-900">Add Bank Account</h2>
            <p class="text-xs sm:text-sm text-slate-500">Select a major Indian bank preset or create a custom account</p>
        </div>
        <a href="/accounts" class="text-xs font-semibold text-slate-500 hover:text-slate-900 flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back</span>
        </a>
    </div>

    <!-- Bank Presets Selector -->
    <div class="fin-card rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Popular Major Indian Banks (Click to auto-fill)</label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            {% for b in bank_presets %}
            <button type="button" onclick="selectBankPreset('{{ b.name }}', '{{ b.color }}')" class="p-2.5 rounded-2xl border border-slate-200 hover:border-slate-400 bg-slate-50 hover:bg-white text-left transition-all flex items-center gap-2.5 group cursor-pointer shadow-xs">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center text-[10px] font-bold text-white shadow-xs shrink-0" style="background-color: {{ b.color }};">
                    <i class="fa-solid fa-building-columns text-[10px]"></i>
                </div>
                <span class="text-xs font-bold text-slate-700 group-hover:text-slate-900 truncate">{{ b.short_name }}</span>
            </button>
            {% endfor %}
        </div>
    </div>

    <!-- Form -->
    <div class="fin-card rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
        <form action="/accounts/bank/new" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Bank Name *</label>
                    <input type="text" id="bank_name_input" name="bank_name" required placeholder="e.g. HDFC Bank" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Account Nickname *</label>
                    <input type="text" name="account_name" required placeholder="e.g. Salary Account / Savings" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Account Last 4 Digits *</label>
                    <input type="text" maxlength="4" pattern="\d{4}" name="account_number_last4" required placeholder="e.g. 5678" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">IFSC Code (Optional)</label>
                    <input type="text" name="ifsc_code" placeholder="e.g. HDFC0001234" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs uppercase">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Initial / Opening Balance ({{ user.currency_symbol }}) *</label>
                    <input type="number" step="0.01" min="0" name="initial_balance" value="0.00" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-extrabold text-sm focus:outline-none focus:border-slate-900 focus:bg-white shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Brand Color Accent</label>
                    <input type="color" id="bank_color_input" name="color" value="#004c8f" class="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl p-1 cursor-pointer">
                </div>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="/accounts" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm cursor-pointer transition-colors">
                    Create Bank Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function selectBankPreset(name, color) {
        document.getElementById('bank_name_input').value = name;
        document.getElementById('bank_color_input').value = color;
    }
</script>
{% endblock %}
