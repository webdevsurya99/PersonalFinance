{% extends "base.html" %}

{% block title %}Edit Transaction - FinMinimal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-black tracking-tight text-slate-900">Edit Transaction</h2>
            <p class="text-xs sm:text-sm text-slate-500">Modify transaction details and adjust account balance</p>
        </div>
        <a href="/transactions" class="text-xs font-semibold text-slate-500 hover:text-slate-900 flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to List</span>
        </a>
    </div>

    <div class="fin-card rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
        <form action="/transactions/{{ txn.id }}/edit" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- Type -->
            <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 rounded-2xl border border-slate-200/80">
                <label class="flex items-center justify-center gap-2 py-2.5 rounded-xl cursor-pointer text-xs font-bold transition-all has-[:checked]:bg-white has-[:checked]:text-rose-600 has-[:checked]:shadow-xs text-slate-500 hover:text-slate-800">
                    <input type="radio" name="type" value="expense" {% if txn.type == 'expense' %}checked{% endif %} class="hidden">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                    <span>Expense</span>
                </label>
                <label class="flex items-center justify-center gap-2 py-2.5 rounded-xl cursor-pointer text-xs font-bold transition-all has-[:checked]:bg-white has-[:checked]:text-emerald-600 has-[:checked]:shadow-xs text-slate-500 hover:text-slate-800">
                    <input type="radio" name="type" value="income" {% if txn.type == 'income' %}checked{% endif %} class="hidden">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <span>Income</span>
                </label>
            </div>

            <!-- Amount & Date -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Amount ({{ user.currency_symbol }}) *</label>
                    <input type="number" step="0.01" min="0.01" name="amount" value="{{ txn.amount }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-extrabold text-lg focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Date *</label>
                    <input type="date" name="date" value="{{ txn.date.strftime('%Y-%m-%d') }}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                </div>
            </div>

            <!-- Category -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Category *</label>
                <select name="category_id" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if txn.category_id == cat.id %}selected{% endif %}>{{ cat.icon }} {{ cat.name }} ({{ cat.type }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Payment Source -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Payment Method / Account</label>
                <select name="payment_source" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                    <option value="">None / Cash Account</option>
                    {% if bank_accounts %}
                    <optgroup label="🏦 Bank Accounts">
                        {% for bank in bank_accounts %}
                        <option value="bank:{{ bank.id }}" {% if txn.bank_account_id == bank.id %}selected{% endif %}>🏦 {{ bank.bank_name }} - {{ bank.account_name }} (••{{ bank.account_number_last4 }})</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                    {% if credit_cards %}
                    <optgroup label="💳 Credit Cards">
                        {% for card in credit_cards %}
                        <option value="card:{{ card.id }}" {% if txn.credit_card_id == card.id %}selected{% endif %}>💳 {{ card.bank_name }} {{ card.card_name }} (••{{ card.last_4_digits }})</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
            </div>

            <!-- Trip Link -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Link to Trip</label>
                <select name="trip_id" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                    <option value="">Not linked to a trip</option>
                    {% for trip in trips %}
                    <option value="{{ trip.id }}" {% if txn.trip_id == trip.id %}selected{% endif %}>✈️ {{ trip.name }} ({{ trip.destination }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Tag & Remarks -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Tag</label>
                    <input type="text" name="tag" value="{{ txn.tag or '' }}" placeholder="e.g. Dining, Fuel" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Remarks / Merchant</label>
                    <input type="text" name="remarks" value="{{ txn.remarks or '' }}" placeholder="e.g. Swiggy, Uber" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition-all shadow-xs">
                </div>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="/transactions" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm cursor-pointer transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
