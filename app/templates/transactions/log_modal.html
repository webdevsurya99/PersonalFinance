<!-- Quick Lodge Expense / Income Modal -->
<div id="log-transaction-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md overflow-x-hidden overflow-y-auto transition-opacity">
    <div class="relative w-full max-w-md bg-[#161F30] border border-slate-700/80 rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden my-auto flex flex-col box-border">
        
        <!-- Modal Header -->
        <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between bg-[#121826]/90 shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <h3 class="font-bold text-sm sm:text-base text-white">Record Transaction</h3>
            </div>
            <button type="button" onclick="closeLogModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-xs transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Form Body -->
        <form action="/transactions/new" method="POST" class="p-3.5 sm:p-4 overflow-y-auto overflow-x-hidden space-y-2.5 max-h-[calc(85vh-56px)] box-border">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- Transaction Type Switcher (Expense / Income) -->
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-900/90 rounded-xl border border-slate-800">
                <label class="flex items-center justify-center gap-1.5 py-1.5 rounded-lg cursor-pointer text-xs font-semibold has-[:checked]:bg-rose-500/20 has-[:checked]:text-rose-400 has-[:checked]:border has-[:checked]:border-rose-500/30 text-slate-400 transition-all">
                    <input type="radio" id="modal-type-expense" name="type" value="expense" checked onchange="onTransactionTypeChange('expense')" class="hidden">
                    <i class="fa-solid fa-arrow-trend-down text-xs"></i>
                    <span>Expense</span>
                </label>
                <label class="flex items-center justify-center gap-1.5 py-1.5 rounded-lg cursor-pointer text-xs font-semibold has-[:checked]:bg-emerald-500/20 has-[:checked]:text-emerald-400 has-[:checked]:border has-[:checked]:border-emerald-500/30 text-slate-400 transition-all">
                    <input type="radio" id="modal-type-income" name="type" value="income" onchange="onTransactionTypeChange('income')" class="hidden">
                    <i class="fa-solid fa-arrow-trend-up text-xs"></i>
                    <span>Income</span>
                </label>
            </div>

            <!-- Amount & Date (2 Columns on all screens) -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Amount ({{ user.currency_symbol }}) *</label>
                    <div class="relative">
                        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xs">{{ user.currency_symbol }}</span>
                        <input type="number" step="0.01" min="0.01" id="modal-amount-input" name="amount" required placeholder="0.00" class="w-full pl-6 pr-2 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white font-bold text-sm focus:outline-none focus:border-blue-500 placeholder-slate-600 box-border">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Date *</label>
                    <input type="date" name="date" value="{{ current_date.strftime('%Y-%m-%d') if current_date else '' }}" required class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white text-xs focus:outline-none focus:border-blue-500 box-border">
                </div>
            </div>

            <!-- Category & Payment Source -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div class="min-w-0">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Category *</label>
                    <select id="modal-category-select" name="category_id" required class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white text-xs focus:outline-none focus:border-blue-500 truncate box-border">
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" data-type="{{ cat.type }}">{{ cat.icon }} {{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="min-w-0">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Paid Via / Received In</label>
                    <select name="payment_source" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white text-xs focus:outline-none focus:border-blue-500 truncate box-border">
                        <option value="">None / Cash</option>
                        {% if bank_accounts %}
                        <optgroup label="🏦 Bank Accounts">
                            {% for bank in bank_accounts %}
                            <option value="bank:{{ bank.id }}">🏦 {{ bank.bank_name }} (••{{ bank.account_number_last4 }}) [{{ user.currency_symbol }}{{ "%.0f"|format(bank.current_balance) }}]</option>
                            {% endfor %}
                        </optgroup>
                        {% endif %}
                        {% if credit_cards %}
                        <optgroup label="💳 Credit Cards">
                            {% for card in credit_cards %}
                            <option value="card:{{ card.id }}">💳 {{ card.card_name }} (••{{ card.last_4_digits }}) [{{ user.currency_symbol }}{{ "%.0f"|format(card.available_limit) }}]</option>
                            {% endfor %}
                        </optgroup>
                        {% endif %}
                    </select>
                </div>
            </div>

            <!-- Trip & Tag (2 Columns) -->
            <div class="grid grid-cols-2 gap-2">
                <div class="min-w-0">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5 truncate">
                        <i class="fa-solid fa-plane-departure text-cyan-400 mr-0.5"></i> Trip
                    </label>
                    <select name="trip_id" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white text-xs focus:outline-none focus:border-blue-500 truncate box-border">
                        <option value="">No trip</option>
                        {% for trip in active_trips if active_trips %}
                        <option value="{{ trip.id }}">✈️ {{ trip.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="min-w-0">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Tag</label>
                    <input type="text" name="tag" placeholder="#flight, #dinner" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white text-xs focus:outline-none focus:border-blue-500 placeholder-slate-600 box-border">
                </div>
            </div>

            <!-- Remarks / Note -->
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Remarks / Note</label>
                <input type="text" name="remarks" placeholder="Add details..." class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white text-xs focus:outline-none focus:border-blue-500 placeholder-slate-600 box-border">
            </div>

            <!-- Submit Button -->
            <div class="pt-1">
                <button type="submit" class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md shadow-blue-600/30 flex items-center justify-center gap-1.5 transition-all cursor-pointer">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>Save Transaction</span>
                </button>
            </div>
        </form>
    </div>
</div>
