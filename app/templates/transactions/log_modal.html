<!-- Quick Lodge Expense / Income Modal (Light FinTech Style) -->
<div id="log-transaction-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-xs overflow-x-hidden overflow-y-auto transition-opacity">
    <div class="relative w-full max-w-md bg-white border border-slate-200/90 rounded-3xl shadow-2xl overflow-hidden my-auto flex flex-col box-border">
        
        <!-- Modal Header -->
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-full bg-[#0F172A] text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <h3 class="font-extrabold text-sm sm:text-base text-slate-900">Record Transaction</h3>
            </div>
            <button type="button" onclick="closeLogModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center text-xs transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Form Body -->
        <form action="/transactions/new" method="POST" class="p-4 sm:p-5 overflow-y-auto overflow-x-hidden space-y-3 max-h-[calc(85vh-56px)] box-border">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- Transaction Type Switcher (Expense / Income) -->
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-2xl border border-slate-200/70">
                <label class="flex items-center justify-center gap-1.5 py-2 rounded-xl cursor-pointer text-xs font-bold has-[:checked]:bg-[#0F172A] has-[:checked]:text-white has-[:checked]:shadow-xs text-slate-500 transition-all">
                    <input type="radio" id="modal-type-expense" name="type" value="expense" checked onchange="onTransactionTypeChange('expense')" class="hidden">
                    <i class="fa-solid fa-arrow-trend-down text-xs"></i>
                    <span>Expense</span>
                </label>
                <label class="flex items-center justify-center gap-1.5 py-2 rounded-xl cursor-pointer text-xs font-bold has-[:checked]:bg-[#10B981] has-[:checked]:text-white has-[:checked]:shadow-xs text-slate-500 transition-all">
                    <input type="radio" id="modal-type-income" name="type" value="income" onchange="onTransactionTypeChange('income')" class="hidden">
                    <i class="fa-solid fa-arrow-trend-up text-xs"></i>
                    <span>Income</span>
                </label>
            </div>

            <!-- Amount & Date (2 Columns on all screens) -->
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Amount ({{ user.currency_symbol }}) *</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-slate-400 font-bold text-xs pointer-events-none">{{ user.currency_symbol }}</span>
                        <input type="number" step="0.01" min="0.01" id="modal-amount-input" name="amount" required placeholder="0.00" class="w-full h-11 pl-7 pr-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-bold text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 box-border leading-none transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Date *</label>
                    <div class="relative flex items-center">
                        <input type="date" name="date" value="{{ current_date.strftime('%Y-%m-%d') if current_date else '' }}" required class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-semibold text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white box-border leading-none transition-colors">
                    </div>
                </div>
            </div>

            <!-- Category & Payment Source -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div class="min-w-0">
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Category *</label>
                    <div class="relative flex items-center">
                        <select id="modal-category-select" name="category_id" required class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white truncate box-border leading-none transition-colors">
                            <option value="">Select Category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" data-type="{{ cat.type }}">{{ cat.icon }} {{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="min-w-0">
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Account / Source</label>
                    <div class="relative flex items-center">
                        <select name="payment_source" id="modal-payment-source" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white truncate box-border leading-none transition-colors">
                            <option value="">💵 Cash in Hand [{{ user.currency_symbol }}{{ "%.2f"|format(user.cash_balance or 0.0) }}]</option>
                            {% if bank_accounts %}
                            <optgroup label="🏦 Bank Accounts">
                                {% for bank in bank_accounts %}
                                <option value="bank:{{ bank.id }}">🏦 {{ bank.bank_name }} (••{{ bank.account_number_last4 }}) [{{ user.currency_symbol }}{{ "%.0f"|format(bank.current_balance) }}]</option>
                                {% endfor %}
                            </optgroup>
                            {% endif %}
                            {% if credit_cards %}
                            <optgroup label="💳 Credit Cards">
                                {% for card in credit_cards %}
                                <option value="card:{{ card.id }}">💳 {{ card.card_name }} (••{{ card.last_4_digits }}) [{{ user.currency_symbol }}{{ "%.0f"|format(card.available_limit) }}]</option>
                                {% endfor %}
                            </optgroup>
                            {% endif %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- Trip & Tag (2 Columns) -->
            <div class="grid grid-cols-2 gap-2.5">
                <div class="min-w-0">
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 truncate">
                        <i class="fa-solid fa-plane-departure text-cyan-600 mr-0.5"></i> Trip
                    </label>
                    <div class="relative flex items-center">
                        <select name="trip_id" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white truncate box-border leading-none transition-colors">
                            <option value="">No trip</option>
                            {% for trip in active_trips if active_trips %}
                            <option value="{{ trip.id }}">✈️ {{ trip.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="min-w-0">
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Tag</label>
                    <div class="relative flex items-center">
                        <input type="text" name="tag" placeholder="#dinner, #flight" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 box-border leading-none transition-colors">
                    </div>
                </div>
            </div>

            <!-- Remarks / Note -->
            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">Description / Merchant</label>
                <div class="relative flex items-center">
                    <input type="text" id="log-remarks" name="remarks" placeholder="e.g. Noodles, Uber, Groceries" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs sm:text-sm focus:outline-none focus:border-slate-900 focus:bg-white placeholder-slate-400 box-border leading-none transition-colors">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" class="w-full h-12 bg-[#0F172A] hover:bg-slate-800 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-md shadow-slate-900/15 flex items-center justify-center gap-2 transition-all cursor-pointer active:scale-98">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>Save Transaction</span>
                </button>
            </div>
        </form>
    </div>
</div>
